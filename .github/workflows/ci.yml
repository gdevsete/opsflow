name: CI — Build, RLS & LGPD/GDPR Integration Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opsflow
          POSTGRES_PASSWORD: opsflow_dev_secret
          POSTGRES_DB: opsflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://opsflow:opsflow_dev_secret@localhost:5432/opsflow
      JWT_SECRET: ci-super-secret-jwt-signing-key-32chars
      PII_ENCRYPTION_KEY_HEX: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      CORS_ORIGIN: http://localhost:5173

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Run database migrations
        run: npm run db:migrate --workspace=@opsflow/api

      - name: Run backend security, RLS & compliance tests
        run: npm test --workspace=@opsflow/api

      - name: Build API and Web production bundles
        run: npm run build --workspaces --if-present